<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Admin sida</title>
    <style>
        body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:40px; }
        button { background:#b30000; color:#fff; border:0; padding:12px 20px; font-size:16px; cursor:pointer; border-radius:6px; }
        button:hover { background:#e60000; }
        button:disabled { opacity:0.6; cursor:not-allowed; }
        #result { margin-top:20px; padding:12px; border-radius:6px; white-space:pre-wrap; }
        .success { background:#1f4d1f; }
        .error { background:#4d1f1f; }
        .info { background:#222; }
    </style>
</head>
<body>

<h1>Admin</h1>
<p>Tryck här för att ladda in fake-story.</p>

<button id="importBtn" onclick="importStory()">Ladda in fake story</button>

<div id="result" class="info">Redo.</div>

<script>
    async function importStory() {
        const btn = document.getElementById("importBtn");
        const resultDiv = document.getElementById("result");

        btn.disabled = true;
        resultDiv.className = "info";
        resultDiv.textContent = "Importerar...";

        try {
            const response = await fetch("/api/admin/story/import-fake-life", {
                method: "POST",
                headers: { "Accept": "application/json" }
            });

            // Försök alltid läsa body (bra felmeddelanden)
            const contentType = response.headers.get("content-type") || "";
            const body = contentType.includes("application/json")
                ? await response.json()
                : await response.text();

            if (!response.ok) {
                const msg = typeof body === "string" ? body : JSON.stringify(body, null, 2);
                throw new Error(`HTTP ${response.status}: ${msg}`);
            }

            // body förväntas vara: { "section": "...", "paragraphsImported": 123 }
            resultDiv.className = "success";
            resultDiv.textContent =
                `Klart!\n` +
                `Sektion: ${body.section}\n` +
                `Importerade stycken: ${body.paragraphsImported}`;

        } catch (err) {
            resultDiv.className = "error";
            resultDiv.textContent = "Fel vid import:\n" + (err?.message ?? err);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
